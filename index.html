<!DOCTYPE html>
<html lang="id" data-theme="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portofolio</title>
<meta name="description" content="Portofolio mobile developer dalam bentuk lembar gambar teknik (blueprint).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Konsep: lembar gambar teknik (blueprint). Setiap bagian adalah satu lembar bernomor, proyek adalah gambar kerja dengan tabel spesifikasi. */
:root { --bg: #103a85; --bg2: #0a2a66; --ln: #eaf2ff; --ln2: rgba(234, 242, 255, 0.5); --ln3: rgba(234, 242, 255, 0.15); --ln4: rgba(234, 242, 255, 0.06); --acc: #ffd84a; --cy: #8fe6ff; --ink: #f4f8ff; --mute: rgba(244, 248, 255, 0.72); --sheet: rgba(6, 26, 74, 0.34); --ok: #0a2a66;
  --disp: "Barlow Condensed", "Roboto Condensed", "DejaVu Sans Condensed", "Arial Narrow", sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; color-scheme: dark; }
html[data-theme="paper"] { --bg: #f3efe2; --bg2: #e9e3cf; --ln: #163f96; --ln2: rgba(22, 63, 150, 0.55); --ln3: rgba(22, 63, 150, 0.14); --ln4: rgba(22, 63, 150, 0.06); --acc: #d1380f; --cy: #0a7fa8; --ink: #10306f; --mute: rgba(16, 48, 111, 0.78); --sheet: rgba(255, 255, 255, 0.45); --ok: #f3efe2; color-scheme: light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; scroll-padding-top: 74px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background 400ms, color 400ms; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(0, 0, 20, 0.28) 100%), linear-gradient(var(--ln3) 1px, transparent 1px), linear-gradient(90deg, var(--ln3) 1px, transparent 1px), linear-gradient(var(--ln4) 1px, transparent 1px), linear-gradient(90deg, var(--ln4) 1px, transparent 1px);
  background-size: 100% 100%, 100px 100px, 100px 100px, 20px 20px, 20px 20px; }
html[data-theme="paper"] body::before { background-image: linear-gradient(var(--ln3) 1px, transparent 1px), linear-gradient(90deg, var(--ln3) 1px, transparent 1px), linear-gradient(var(--ln4) 1px, transparent 1px), linear-gradient(90deg, var(--ln4) 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; } ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; } img { display: block; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
.mono, .cap, .lbl { font-family: var(--mono); }
.cap { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); }

/* bilah atas dan blok judul tetap */
.top { position: fixed; z-index: 30; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 10px 22px; font: 500 12px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--ln3); }
.top .brand { text-decoration: none; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.top .brand i { width: 16px; height: 16px; border: 1.5px solid var(--ln); display: inline-block; position: relative; } .top .brand i::after { content: ""; position: absolute; inset: 3px; background: var(--acc); }
.top nav { display: flex; gap: 20px; } .top nav button { color: var(--mute); padding: 4px 0; border-bottom: 1px dashed transparent; } .top nav button:hover, .top nav button[aria-current="true"] { color: var(--acc); border-color: var(--acc); }
.tg { border: 1px solid var(--ln2); padding: 5px 12px; text-transform: uppercase; } .tg:hover { border-color: var(--acc); color: var(--acc); }
.tblk { position: fixed; z-index: 30; right: 16px; bottom: 16px; width: 312px; border: 1.5px solid var(--ln); background: color-mix(in srgb, var(--bg2) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.tblk .r { display: grid; grid-template-columns: 78px 1fr auto; border-bottom: 1px solid var(--ln2); } .tblk .r > * { padding: 6px 9px; } .tblk .r span { color: var(--mute); border-right: 1px solid var(--ln2); } .tblk .r b { font-weight: 600; }
.tblk .r.last { border: 0; } .tblk .go { background: var(--acc); color: #0a2a66; font-weight: 700; letter-spacing: 0.08em; } .tblk .go:hover { filter: brightness(1.08); }
.tblk .bar { height: 3px; background: var(--ln3); } .tblk .bar i { display: block; height: 100%; width: 0; background: var(--acc); }
#xh { position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: 0; transition: opacity 200ms; } #xh.on { opacity: 1; }
#xh i { position: absolute; background: var(--cy); opacity: 0.22; } #xh .h { left: 0; right: 0; height: 1px; top: 0; } #xh .v { top: 0; bottom: 0; width: 1px; left: 0; }
#xh span { opacity: 0.8; position: absolute; font: 500 10px var(--mono); color: var(--cy); background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 1px 5px; letter-spacing: 0.06em; white-space: nowrap; }

/* lembar */
.page { overflow-x: clip; max-width: 1260px; margin: 0 auto; padding: 84px 26px 150px; }
.sheet { position: relative; border: 1.5px solid var(--ln); background: var(--sheet); padding: 50px 46px 46px; margin-bottom: 60px; }
.sheet::after { content: ""; position: absolute; inset: 7px; border: 1px solid var(--ln2); pointer-events: none; }
.cm { position: absolute; width: 22px; height: 22px; pointer-events: none; background: linear-gradient(var(--ln), var(--ln)) 50% 0 / 1px 100% no-repeat, linear-gradient(var(--ln), var(--ln)) 0 50% / 100% 1px no-repeat; opacity: 0.8; }
.cm.a { left: -12px; top: -12px; } .cm.b { right: -12px; top: -12px; } .cm.c { left: -12px; bottom: -12px; } .cm.d { right: -12px; bottom: -12px; }
.zt { position: absolute; top: 11px; left: 30px; right: 30px; display: flex; justify-content: space-around; font: 500 10px var(--mono); color: var(--mute); pointer-events: none; z-index: 1; }
.zs { position: absolute; left: 11px; top: 30px; bottom: 30px; display: flex; flex-direction: column; justify-content: space-around; font: 500 10px var(--mono); color: var(--mute); pointer-events: none; z-index: 1; }
.tab { position: absolute; top: -13px; left: 40px; background: var(--bg); padding: 0 12px; font: 500 12px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; display: flex; gap: 12px; z-index: 2; } .tab b { color: var(--acc); font-weight: 600; }
.foot { position: absolute; right: 40px; bottom: -11px; background: var(--bg); padding: 0 10px; font: 500 11px var(--mono); letter-spacing: 0.1em; color: var(--mute); display: flex; gap: 14px; z-index: 2; }
.body { position: relative; z-index: 2; min-width: 0; }
.hero > * { min-width: 0; }
.rv { opacity: 0; transform: translateY(14px); transition: opacity 700ms ease calc(var(--d, 0) * 1s), transform 700ms ease calc(var(--d, 0) * 1s); } .in .rv { opacity: 1; transform: none; }
.h2 { font: 700 clamp(40px, 6vw, 76px)/0.92 var(--disp); letter-spacing: 0.01em; text-transform: uppercase; }
.h2 em { font-style: normal; color: transparent; -webkit-text-stroke: 1.4px var(--ln); }
.kick { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; } .kick::after { content: ""; height: 1px; flex: 1; background: var(--ln2); }

/* garis dimensi */
.dimh { display: flex; align-items: center; gap: 10px; color: var(--cy); font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.dimh i { flex: 1; height: 1px; background: currentColor; position: relative; transform: scaleX(0); transition: transform 1.1s cubic-bezier(.2, .7, .2, 1) 0.2s; } .dimh i:first-child { transform-origin: right; } .dimh i:last-child { transform-origin: left; } .in .dimh i { transform: none; }
.dimh i::before { content: ""; position: absolute; top: -3px; border: 4px solid transparent; } .dimh i:first-child::before { left: 0; border-right: 9px solid currentColor; border-left: 0; } .dimh i:last-child::before { right: 0; border-left: 9px solid currentColor; border-right: 0; }
.dimh i::after { content: ""; position: absolute; top: -8px; height: 17px; width: 1px; background: currentColor; } .dimh i:first-child::after { left: 0; } .dimh i:last-child::after { right: 0; }
.dimv { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--cy); font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
.dimv i { flex: 1; width: 1px; background: currentColor; position: relative; } .dimv i::before { content: ""; position: absolute; left: -3px; border: 4px solid transparent; } .dimv i:first-child::before { top: 0; border-bottom: 9px solid currentColor; border-top: 0; } .dimv i:last-child::before { bottom: 0; border-top: 9px solid currentColor; border-bottom: 0; }
.dimv i::after { content: ""; position: absolute; left: -8px; width: 17px; height: 1px; background: currentColor; } .dimv i:first-child::after { top: 0; } .dimv i:last-child::after { bottom: 0; }
.dimv span { writing-mode: vertical-rl; transform: rotate(180deg); }

/* hero */
.hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; align-items: center; min-height: calc(100vh - 190px); }
.hl { display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
.nw { position: relative; display: inline-block; padding: 36px 44px 0 0; }
.nw .dimh { position: absolute; top: 0; left: 0; right: 44px; } .nw .dimv { position: absolute; right: 0; top: 36px; bottom: 0; }
.name { font: 700 clamp(46px, 6.3vw, 100px)/0.86 var(--disp); text-transform: uppercase; letter-spacing: 0.005em; display: block; margin: 0;
  color: transparent; -webkit-text-stroke: 1.5px var(--ln); background: linear-gradient(90deg, var(--ink) 50%, transparent 50%) 100% 0 / 200% 100% no-repeat; -webkit-background-clip: text; background-clip: text; }
.name span { display: block; }
.loaded .name { animation: wipe 1.8s cubic-bezier(.6, 0, .2, 1) 0.6s forwards; } @keyframes wipe { to { background-position: 0 0; } }
.role { font: 500 15px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--acc); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; } .chips li { font: 500 13px var(--mono); border: 1px solid var(--ln); padding: 4px 12px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; } .chips u { width: 8px; height: 8px; background: var(--c); display: inline-block; }
.sub { font-size: 19px; max-width: 46ch; color: var(--mute); }
.toc { display: grid; grid-template-columns: repeat(3, auto); gap: 0 26px; font: 500 12px var(--mono); letter-spacing: 0.05em; text-transform: uppercase; border-top: 1px solid var(--ln2); padding-top: 12px; width: 100%; max-width: 640px; }
.toc button { display: flex; gap: 10px; padding: 3px 0; color: var(--mute); } .toc button b { color: var(--acc); font-weight: 600; } .toc button:hover { color: var(--ink); }
.hr { position: relative; display: grid; place-items: center; min-height: 620px; padding: 0 72px 0 36px; }
.comp { position: absolute; width: min(560px, 120%); aspect-ratio: 1; opacity: 0.9; animation: spin 140s linear infinite; pointer-events: none; } @keyframes spin { to { transform: rotate(360deg); } }
.pw { position: relative; width: min(310px, 66%); }
.phone { position: relative; display: block; width: 100%; aspect-ratio: 393 / 852; border: 2px solid var(--ln); border-radius: 15% / 7%; padding: 3.2%; background: color-mix(in srgb, var(--bg2) 70%, transparent); cursor: pointer; box-shadow: 0 0 0 6px var(--ln4), 0 0 40px rgba(143, 230, 255, 0.12); }
.scr { position: relative; width: 100%; height: 100%; border-radius: 11% / 5.2%; overflow: hidden; border: 1px solid var(--ln2); background: var(--bg2); }
.scr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.scr .bw { filter: grayscale(1) contrast(1.15) brightness(0.95); mix-blend-mode: screen; opacity: 0.88; } html[data-theme="paper"] .scr .bw { mix-blend-mode: multiply; filter: grayscale(1) contrast(1.1) brightness(1.05); }
.scr .co { opacity: 0; transition: opacity 400ms; } .phone:hover .co, .phone.on .co, .phone:focus-visible .co { opacity: 1; }
.scr .gr { position: absolute; inset: 0; background-image: linear-gradient(var(--ln3) 1px, transparent 1px), linear-gradient(90deg, var(--ln3) 1px, transparent 1px); background-size: 20px 20px; pointer-events: none; mix-blend-mode: screen; }
.isl { position: absolute; top: 2.6%; left: 50%; width: 27%; height: 2.5%; transform: translateX(-50%); border: 1.5px solid var(--ln); border-radius: 99px; background: var(--bg2); z-index: 2; }
.cb { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--acc); color: #0a2a66; font: 700 12px/22px var(--mono); text-align: center; z-index: 3; box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 35%, transparent); }
.call { position: absolute; right: calc(100% + 16px); display: flex; align-items: center; gap: 0; font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; color: var(--acc); }
.call::after { content: ""; display: block; width: 0; height: 1px; background: var(--acc); margin-left: 8px; transition: width 800ms ease 0.9s; } .in .call::after { width: 24px; }
.pw .dimh { position: absolute; left: 0; right: 0; bottom: -34px; } .pw .dimv { position: absolute; left: calc(100% + 16px); top: 0; bottom: 0; }
.hint { position: absolute; top: -34px; left: 0; right: 0; font: 500 11px var(--mono); color: var(--mute); text-align: center; letter-spacing: 0.08em; text-transform: uppercase; }

/* tentang */
.about { display: grid; grid-template-columns: 1.3fr 1fr; gap: 56px; align-items: start; margin-top: 26px; }
.lead { font: 500 clamp(21px, 2.4vw, 30px)/1.32 var(--body); letter-spacing: -0.01em; }
.box { margin-top: 30px; border: 1px solid var(--ln2); } .box h3 { font: 500 12px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 14px; border-bottom: 1px solid var(--ln2); color: var(--acc); }
.box ol { counter-reset: n; } .box li { counter-increment: n; display: grid; grid-template-columns: 34px 1fr; padding: 10px 14px; border-bottom: 1px solid var(--ln3); color: var(--mute); } .box li:last-child { border: 0; } .box li::before { content: counter(n) "."; font: 600 13px var(--mono); color: var(--cy); }
.stats { display: grid; gap: 30px; } .stat b { display: block; font: 700 clamp(64px, 8vw, 112px)/0.85 var(--disp); color: var(--acc); letter-spacing: 0.01em; margin-bottom: 8px; }
.stat .dimh { color: var(--ln2); }

/* arsitektur (pohon keahlian) */
.tree { margin-top: 34px; display: flex; flex-direction: column; align-items: center; }
.nd { font: 500 13px var(--mono); letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid var(--ln); padding: 8px 14px; background: var(--bg2); position: relative; text-align: center; }
.nd.root { padding: 12px 26px; border-width: 2px; font-weight: 600; } .nd.root small { display: block; color: var(--acc); font-size: 11px; margin-top: 2px; }
.rootl { width: 1px; height: 30px; background: var(--ln); transform-origin: top; transform: scaleY(0); transition: transform 600ms ease 0.2s; } .in .rootl { transform: none; }
.grps { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); width: 100%; }
.g { position: relative; padding: 30px 9px 0; }
.g::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--ln); transform: scaleX(0); transition: transform 800ms ease 0.7s; } .g:first-child::before { left: 50%; } .g:last-child::before { right: 50%; } .g:only-child::before { display: none; } .in .g::before { transform: none; }
.g::after { content: ""; position: absolute; top: 0; left: 50%; width: 1px; height: 30px; background: var(--ln); transform-origin: top; transform: scaleY(0); transition: transform 500ms ease 1.2s; } .in .g::after { transform: none; }
.g .nd { background: var(--acc); color: #0a2a66; border-color: var(--acc); font-weight: 600; }
.g ul { margin: 0 0 0 16px; padding-left: 16px; border-left: 1px solid var(--ln); padding-top: 12px; }
.g li { position: relative; padding: 5px 0; } .g li::before { content: ""; position: absolute; left: -16px; top: 50%; width: 14px; height: 1px; background: var(--ln); }
.g li span { display: block; border: 1px solid var(--ln2); padding: 7px 11px; font: 500 14px var(--mono); transition: background 160ms, color 160ms, border-color 160ms, transform 160ms; } .g li small { display: block; font-size: 11px; color: var(--mute); letter-spacing: 0.02em; margin-top: 1px; }
.g li:hover span { background: var(--ln); color: var(--bg2); border-color: var(--ln); transform: translateX(5px); } .g li:hover small { color: inherit; }
.leg { margin-top: 28px; display: flex; gap: 22px; font: 500 11px var(--mono); color: var(--mute); text-transform: uppercase; letter-spacing: 0.08em; flex-wrap: wrap; } .leg i { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 7px; border: 1px solid var(--ln); } .leg i.y { background: var(--acc); border-color: var(--acc); }

/* proyek (gambar kerja) */
.drw { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 34px; margin-top: 20px; align-items: stretch; }
.view { position: relative; border: 1px dashed var(--ln2); padding: 40px 30px 50px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 480px; background-image: radial-gradient(circle at 50% 50%, rgba(143, 230, 255, 0.1), transparent 60%); }
.view .vl { position: absolute; top: 12px; left: 14px; font: 500 11px var(--mono); letter-spacing: 0.1em; color: var(--mute); text-transform: uppercase; }
.view .dimh { position: absolute; left: 30px; right: 30px; bottom: 14px; }
.fan2 { display: flex; justify-content: center; gap: 22px; align-items: flex-start; width: 100%; }
.fan2 .pw2 { position: relative; width: clamp(110px, 17vw, 178px); flex: none; } .fan2 .pw2:nth-child(2) { margin-top: 34px; } .fan2 .pw2:nth-child(3) { margin-top: 8px; }
.pw2 .phone { cursor: zoom-in; } .pw2 .cb { right: -9px; top: -9px; }
.wf { width: min(220px, 52%); display: block; } .wf svg { width: 100%; height: auto; overflow: visible; }
.dr { fill: none; stroke: var(--ln); stroke-width: 1.6; stroke-dasharray: 1; stroke-dashoffset: 1; stroke-linecap: round; stroke-linejoin: round; } .dr.t { stroke: var(--ln2); stroke-width: 1; } .dr.y { stroke: var(--acc); }
.in .dr { animation: draw 1.8s ease forwards; animation-delay: calc(var(--d, 0) * 1s); } @keyframes draw { to { stroke-dashoffset: 0; } }
.wf text { font: 700 54px var(--disp); fill: var(--ln); letter-spacing: 0.04em; }
.spec .pt { font: 700 clamp(36px, 4.2vw, 58px)/0.95 var(--disp); text-transform: uppercase; margin-bottom: 18px; }
.tbl { border: 1px solid var(--ln); } .tbl > div { display: grid; grid-template-columns: 112px 1fr; border-bottom: 1px solid var(--ln2); } .tbl > div:last-child { border: 0; }
.tbl dt { font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); padding: 10px 12px; border-right: 1px solid var(--ln2); } .tbl dd { padding: 9px 12px; font-size: 15px; }
.tbl .tc { display: flex; flex-wrap: wrap; gap: 6px; } .tbl .tc span { font: 500 12px var(--mono); border: 1px solid var(--ln2); padding: 1px 9px; text-transform: uppercase; }
.notes { margin-top: 20px; } .notes h3 { font: 500 12px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--acc); margin-bottom: 8px; } .notes li { display: flex; gap: 10px; align-items: center; padding: 4px 0; color: var(--mute); font-size: 14px; } .notes li b { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--acc); color: #0a2a66; font: 700 11px/20px var(--mono); text-align: center; }
.fn { font-size: 13px; color: var(--mute); }

/* pengalaman (tabel revisi) */
.rt { margin-top: 28px; border: 1px solid var(--ln); }
.rt .hd, .rt .row { display: grid; grid-template-columns: 64px 170px 1.1fr 1.1fr 120px; align-items: center; }
.rt .hd { font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); border-bottom: 1px solid var(--ln); } .rt .hd > *, .rt .row > * { padding: 14px 14px; border-right: 1px solid var(--ln3); } .rt .hd > :last-child, .rt .row > :last-child { border-right: 0; }
.rt .it { border-bottom: 1px solid var(--ln2); } .rt .it:last-child { border-bottom: 0; }
.rt .row { width: 100%; text-align: left; transition: background 160ms; } .rt .row:hover { background: var(--ln4); }
.rt .rev { font: 700 28px var(--disp); color: var(--acc); } .rt .per { font: 500 13px var(--mono); text-transform: uppercase; } .rt .rl { font: 700 24px/1.05 var(--disp); text-transform: uppercase; } .rt .og { color: var(--mute); }
.rt .st { font: 600 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; } .rt .st::after { content: "+"; margin-left: auto; font-size: 16px; color: var(--cy); transition: transform 200ms; } .rt .row[aria-expanded="true"] .st::after { transform: rotate(45deg); }
.rt .cur .st { color: var(--acc); } .rt .cur .st::before { content: ""; width: 8px; height: 8px; background: var(--acc); border-radius: 50%; animation: blink 1.4s infinite; } @keyframes blink { 50% { opacity: 0.25; } }

/* ===== Peningkatan warna: biru lebih terang dengan gradasi radial seperti kertas blueprint ===== */
:root { --bg: #2a63cf; --bg2: #17419f; --grad: radial-gradient(ellipse 85% 70% at 50% 42%, #4f95ee 0%, #3a78dd 32%, #2a5fcb 62%, #1b44ad 100%); --accg: linear-gradient(135deg, #ffe477, #ffbf3a); --mute: rgba(244, 248, 255, 0.84); --ln2: rgba(234, 242, 255, 0.62); --ln3: rgba(234, 242, 255, 0.2); --ln4: rgba(234, 242, 255, 0.09); --sheet: linear-gradient(165deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.02) 55%, rgba(10, 40, 130, 0.14)); }

html { background: var(--grad) fixed; background-color: var(--bg); }
body { background: transparent; }

.top { background: color-mix(in srgb, var(--bg) 78%, transparent); }
.tab, .foot { background: var(--grad) fixed; background-color: var(--bg); }
.sheet { background: var(--sheet); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06) inset, 0 18px 60px rgba(8, 30, 110, 0.28); }
.tblk { background: linear-gradient(160deg, #1d4eb8, #123893); }
html[data-theme="paper"] .tblk { background: linear-gradient(160deg, #fffdf5, #ece4cc); }
.tblk .go, .btn.y, .g .nd, .cb { background: var(--accg); }
.btn.y:hover { background: var(--accg); }
.tblk .bar i { background: linear-gradient(90deg, #8fe6ff, #ffd84a); }
.stat b { background: var(--accg); -webkit-background-clip: text; background-clip: text; color: transparent; }
.scr .bw { mix-blend-mode: screen; opacity: 0.92; }

/* grid latar dihapus; diganti garis bantu putus-putih saat item di-hover */

function downloadCV() { try { const bin = atob(CV_PDF), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); const url = URL.createObjectURL(new Blob([u], { type: "application/pdf" })), a = document.createElement("a"); a.href = url; a.download = CV_NAME; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); } catch (err) { window.open("data:application/pdf;base64," + CV_PDF, "_blank"); } }
const lb = $("#lb"), lbImg = $("#lb-img"), lbCap = $("#lb-cap"), L = { list: [], i: 0, op: null };
function lbShow() { const s = L.list[L.i]; lbImg.src = s.src; lbImg.alt = "Screenshot " + s.cap; lbCap.textContent = s.cap + " (" + (L.i + 1) + "/" + L.list.length + ")"; }
function lbStep(d) { L.i = (L.i + d + L.list.length) % L.list.length; lbShow(); }
function lbClose() { lb.hidden = true; lbImg.removeAttribute("src"); if (L.op && document.contains(L.op)) L.op.focus({ preventScroll: true }); }
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-cv]")) { downloadCV(); return; }
  const cp = t.closest("[data-copy]");
  if (cp) { const ok = () => { cp.textContent = "Tersalin"; setTimeout(() => { cp.textContent = "Salin alamat"; }, 1600); }; try { navigator.clipboard.writeText(DATA.email).then(ok, () => { cp.textContent = "Gagal menyalin"; }); } catch (err) { cp.textContent = "Gagal menyalin"; } return; }
  const hp = t.closest("#hp"); if (hp) { const on = hp.classList.toggle("on"); hp.setAttribute("aria-pressed", String(on)); return; }
  const sh = t.closest("button.phone[data-p]"); if (sh) { L.list = P[+sh.dataset.p].shots; L.i = +sh.dataset.s; L.op = sh; lbShow(); lb.hidden = false; $("#lb-close").focus(); return; }
  if (t === lb || t.id === "lb-close") { lbClose(); return; } if (t.id === "lb-prev") { lbStep(-1); return; } if (t.id === "lb-next") { lbStep(1); return; }
  const row = t.closest(".rt .row"); if (row) { const open = row.getAttribute("aria-expanded") !== "true"; row.setAttribute("aria-expanded", String(open)); $("#" + row.getAttribute("aria-controls")).classList.toggle("open", open); return; }
  const go = t.closest("[data-go]"); if (go) { e.preventDefault(); const el = document.getElementById(go.dataset.go); if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); }
});
document.addEventListener("keydown", e => { if (!lb.hidden) { if (e.key === "Escape") lbClose(); else if (e.key === "ArrowLeft") lbStep(-1); else if (e.key === "ArrowRight") lbStep(1); } });

/* ---------- garis bantu saat hover ---------- */
(() => {
  if (matchMedia("(hover: none)").matches) return;
  const gl = $("#gl"), hs = $$(".h", gl), vs = $$(".v", gl), bx = $("b", gl);
  const SEL = "a, button, .chips li, .g li span, .nd, .rt .row, .stat, .tblk, .phone, .notes li, .kick, .btn";
  let el = null, raf = 0;
  function draw() { raf = 0; if (!el || !document.contains(el)) { gl.classList.remove("on"); return; } const r = el.getBoundingClientRect(); if (r.width < 4 || r.height < 4) { gl.classList.remove("on"); return; }
    hs[0].style.top = Math.round(r.top) + "px"; hs[1].style.top = Math.round(r.bottom) + "px"; vs[0].style.left = Math.round(r.left) + "px"; vs[1].style.left = Math.round(r.right) + "px";
    bx.style.cssText = "left:" + (r.left - 4) + "px;top:" + (r.top - 4) + "px;width:" + (r.width + 8) + "px;height:" + (r.height + 8) + "px"; gl.classList.add("on"); }
  const sched = () => { if (!raf) raf = requestAnimationFrame(draw); };
  document.addEventListener("pointerover", e => { if (e.pointerType === "touch") return; const t = e.target.closest ? e.target.closest(SEL) : null; if (t && !t.closest("#lb")) { el = t; sched(); } });
  document.addEventListener("pointerout", e => { if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) { const n = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest(SEL) : null; if (!n) { el = null; sched(); } } });
  addEventListener("scroll", sched, { passive: true }); addEventListener("resize", sched);
})();

  };
  const NAMES = Object.keys(MOODS);
  const CHIP = { idle: ["idle", "#2DD4BF"], happy: ["happy", "#4ADE80"], wink: ["winking", "#FB923C"], thinking: ["thinking", "#60A5FA"], smug: ["smug", "#C084FC"], sleepy: ["sleepy", "#818CF8"], surprised: ["surprised", "#FBBF24"], confused: ["confused", "#FB7185"], love: ["in love", "#F472B6"], listening: ["listening", "#38BDF8"], laughing: ["laughing", "#A3E635"], shy: ["shy", "#E879F9"], puppy: ["puppy eyes", "#FDA4AF"], sad: ["sad", "#93C5FD"], crying: ["crying", "#22D3EE"], angry: ["angry", "#F87171"], frightened: ["frightened", "#C4B5FD"], dizzy: ["dizzy", "#FCD34D"], awkward: ["awkward", "#FDE68A"], unamused: ["unamused", "#A1A1AA"], sleeping: ["sleeping", "#7C86FF"], loading: ["loading", "#99F6E4"], lowbattery: ["low battery", "#F59A0C"], error: ["error", "#FF3FA0"] };
  /* di latar biru, warna gelap diganti terang agar tetap terbaca; mode kertas memakai warna asli */
  const PAL = { "#151922": "#f4f8ff", "#2B3050": "#d7e4ff", "#3A4252": "#dbe7ff", "#3D4455": "#dbe7ff", "#1C2B4A": "#eaf1ff", "#243049": "#eaf1ff", "#8FA3C7": "#ffffff", "#9AA3B5": "#ffffff", "#DDE2EC": "rgba(255,255,255,.3)", "#B8C3D8": "#e6efff", "#7F8CA8": "#4a74cc", "#4DB2F5": "#8fe6ff", "#CBE9FF": "#ffffff", "#6C73D9": "#cdd6ff", "#6F7FF0": "#cdd6ff" };
  const dark = () => document.documentElement.dataset.theme !== "paper";
  const layerOf = m => { const [d, f] = MOODS[m]; let s = f(); if (dark()) s = s.replace(/#[0-9A-Fa-f]{6}/g, c => PAL[c.toUpperCase()] || c); const w = document.createElement("div"); w.innerHTML = '<svg class="ml" aria-hidden="true" viewBox="0 0 320 200" style="--d:' + d + 's">' + s + "</svg>"; return w.firstChild; };
  const cache = {};
  let mood = null, prevEl = null, curEl = null, fadeT = 0;
  /* transisi: ekspresi lama "berkedip menutup", ekspresi baru "membuka" dengan pantulan kecil */
  const OUT = [{ opacity: 1, transform: "scale(1,1)" }, { opacity: 0, transform: "scale(.96,.08)" }];
  const IN = [{ opacity: 0, transform: "scale(.9,.08)" }, { opacity: 1, offset: 0.35 }, { opacity: 1, transform: "scale(1.04,1.07)", offset: 0.72 }, { opacity: 1, transform: "scale(1,1)" }];
  function swap(m) {
    if (m === mood || !MOODS[m]) return false;
    mood = m; clearTimeout(fadeT);
    if (prevEl) { prevEl.getAnimations().forEach(a => a.cancel()); prevEl.remove(); prevEl = null; }
    const old = curEl; curEl = layerOf(m); look.appendChild(curEl);
    if (reduce || !curEl.animate) { if (old) old.remove(); }
    else {
      if (old) { prevEl = old; old.animate(OUT, { duration: 170, easing: "cubic-bezier(.5,0,.9,.5)", fill: "forwards" }); }
      curEl.style.opacity = 0; curEl.animate(IN, { duration: 480, delay: old ? 130 : 0, easing: "cubic-bezier(.2,.8,.25,1)", fill: "both" });
      fadeT = setTimeout(() => { if (prevEl) { prevEl.remove(); prevEl = null; } }, 360);
    }
    chipB.textContent = CHIP[m][0]; chipB.style.color = CHIP[m][1]; botEl.dataset.mood = m; window.dispatchEvent(new CustomEvent("botmood", { detail: { mood: m } })); return true;
  }
  /* mesin suasana hati: putaran acak, hover menahan, unhover melanjutkan */
  const M = { running: false, hovering: false, bag: [], tickT: 0, hoverT: 0 };
  const nextMood = () => { if (!M.bag.length) { const b = NAMES.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } if (b[b.length - 1] === mood) [b[0], b[b.length - 1]] = [b[b.length - 1], b[0]]; M.bag = b; } let n = M.bag.pop(); if (n === mood && M.bag.length) { const a = M.bag.pop(); M.bag.unshift(n); n = a; } return n; };
  const gap = () => 3000 + Math.random() * 2000;
  function tick(delay) { clearTimeout(M.tickT); M.tickT = setTimeout(() => { if (!M.running) return; if (M.hovering) { tick(1200); return; } swap(nextMood()); tick(gap()); }, delay); }
  const setMood = (m, extra) => { M.hovering = false; clearTimeout(M.hoverT); swap(m); if (M.running) tick(gap() + (extra || 0)); };
  const hover = m => { M.hovering = true; swap(m); clearTimeout(M.hoverT); M.hoverT = setTimeout(() => { M.hovering = false; if (M.running) tick(300); }, 4800); };
  const unhover = () => { if (!M.hovering) return; M.hovering = false; clearTimeout(M.hoverT); if (M.running) tick(1100); };
  const start = d => { M.running = true; tick(d || gap()); }, stop = () => { M.running = false; clearTimeout(M.tickT); };
  new MutationObserver(() => { if (!mood || !curEl) return; const n = layerOf(mood); curEl.replaceWith(n); curEl = n; }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  window.BotEyes = { setMood, hover, unhover, start, stop, moods: NAMES, get mood() { return mood; } };

  /* tatapan kursor dan tarikan magnet */
  const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a || 1))); return t * t * (3 - 2 * t); };
  const cur = { x: 0, y: 0, on: false }, drift = { x: 0, y: 0, r: 0, run: false, t: 0 };
  let gazeRaf = 0;
  function gaze() { gazeRaf = 0; if (!cur.on) return; const r = botEl.getBoundingClientRect(); if (!r.width) return; const dx = cur.x - (r.left + r.width / 2), dy = cur.y - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1; const k = smooth(0, 0.4 * r.width, d) * (1 - smooth(0.6 * r.width, 1.0 * r.width, d)); look.style.transform = "translate(" + ((dx / d) * k * r.width * 0.07).toFixed(1) + "px," + ((dy / d) * k * r.width * 0.035).toFixed(1) + "px)"; }
  function magStep(dt) {
    let tx = 0, ty = 0, tr = 0;
    if (cur.on && !reduce) { const b = botEl.getBoundingClientRect(), cx = b.left + b.width / 2 - drift.x, cy = b.top + b.height / 2 - drift.y, dx = cur.x - cx, dy = cur.y - cy, d = Math.hypot(dx, dy), R = 24 + b.width * 0.3;
      if (d < R) { const u = 1 - d / R, e = u * u * (3 - 2 * u), pull = 0.42 * e; tx = dx * pull; ty = dy * pull; const cap = Math.min(44, b.width * 0.24), mg = Math.hypot(tx, ty); if (mg > cap) { tx *= cap / mg; ty *= cap / mg; } tr = Math.max(-1, Math.min(1, dx / R)) * 6 * e; } }
    const a = 1 - Math.exp(-dt * 8); drift.x += (tx - drift.x) * a; drift.y += (ty - drift.y) * a; drift.r += (tr - drift.r) * a;
    bob.style.setProperty("--mx", drift.x.toFixed(2) + "px"); bob.style.setProperty("--my", drift.y.toFixed(2) + "px"); bob.style.setProperty("--mr", drift.r.toFixed(2) + "deg");
    return !cur.on && Math.abs(drift.x) < 0.05 && Math.abs(drift.y) < 0.05 && Math.abs(drift.r) < 0.05;
  }
  function magKick() { if (drift.run) return; drift.run = true; drift.t = performance.now(); const loop = t => { const dt = Math.min(0.05, Math.max(0.001, (t - drift.t) / 1000)); drift.t = t; if (magStep(dt)) { drift.run = false; return; } requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  let lastMove = Date.now(), asleep = false;
  addEventListener("mousemove", e => { cur.x = e.clientX; cur.y = e.clientY; cur.on = true; magKick(); if (!gazeRaf) gazeRaf = requestAnimationFrame(gaze); lastMove = Date.now(); if (asleep) { asleep = false; setMood("surprised"); } }, { passive: true });
  document.addEventListener("mouseout", e => { if (!e.relatedTarget) { cur.on = false; magKick(); look.style.transform = ""; } }, { passive: true });
  setInterval(() => { if (!asleep && Date.now() - lastMove > 30000 && !document.hidden) { asleep = true; setMood("sleeping", 60000); } }, 3000);

  /* reaksi terhadap isi halaman */
  const HOVER = [
    [".top .brand", "happy"], [".top nav button:nth-child(1)", "shy"], [".top nav button:nth-child(2)", "smug"], [".top nav button:nth-child(3)", "surprised"], [".top nav button:nth-child(4)", "listening"], [".top nav button:nth-child(5)", "thinking"], [".top nav button:nth-child(6)", "love"],
    [".tg", "sleepy"], [".name", "wink"], [".role", "idle"], [".chips li:nth-child(1)", "smug"], [".chips li:nth-child(2)", "happy"], [".chips li:nth-child(3)", "confused"], [".hero .sub", "listening"], [".hero .toc button", "thinking"],
    [".stat", "surprised"], [".phone", "laughing"], [".g li span", "thinking"], [".nd", "smug"], [".rt .row", "listening"], [".mail, .btn.y", "love"], ["[data-copy]", "surprised"], ["[data-cv]", "puppy"], [".soc li:nth-child(1) a", "love"], [".soc li:nth-child(2) a", "thinking"], [".soc a", "happy"], [".tblk .go", "puppy"], [".tblk", "idle"], [".btn", "wink"], [".stamp, .sign", "happy"], ["#bot", null],
  ];
  const find = t => { for (const [sel, m] of HOVER) { if (t.closest(sel)) return m; } return undefined; };
  document.addEventListener("pointerover", e => { if (e.pointerType === "touch" || !e.target.closest) return; const m = find(e.target); if (m) hover(m); else if (m === undefined && !e.target.closest("#bot")) unhover(); });
  document.addEventListener("pointerout", e => { if (e.pointerType === "touch") return; const to = e.relatedTarget; if (!to || !find(to)) unhover(); });
  document.addEventListener("focusin", e => { const m = e.target.closest && find(e.target); if (m) hover(m); });
  document.addEventListener("focusout", unhover);
  document.addEventListener("click", e => {
    if (e.target.closest("[data-cv]")) { setMood("loading"); setTimeout(() => setMood("happy"), 1500); return; }
    if (e.target.closest("[data-copy]")) { setTimeout(() => setMood(/Gagal/.test(e.target.closest("[data-copy]").textContent) ? "error" : "happy"), 250); return; }
    if (e.target.closest("#bot")) { setMood(nextMood()); }
  });
  botEl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setMood(nextMood()); } });
  /* mulai: bangun (loading) lalu senang, putaran acak jalan hanya saat bot terlihat */
  swap("loading"); setTimeout(() => { if (mood === "loading") swap("happy"); }, 1300);
  if ("IntersectionObserver" in window) new IntersectionObserver(es => { for (const en of es) { if (en.isIntersecting) start(M.running ? undefined : 2200); else stop(); } }, { threshold: 0.2 }).observe(root); else start(2200);
})();
